<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff" id="themeColor">
<title>Mohammed Saleh — AI, Autonomous & Embedded Systems</title>
<meta name="description" content="Mohammed Saleh — engineer working on machine learning over real signals: EMG gesture recognition, autonomous drones, embedded systems and the software around them.">
<meta property="og:title" content="Mohammed Saleh — AI, Autonomous & Embedded Systems">
<meta property="og:description" content="Systems that sense, decide and act. From the sensor and the firmware up to the model and the interface.">
<meta property="og:type" content="website">

<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<script>
/* Inline and blocking on purpose: the theme has to be on <html> before
   the first paint, or a night visitor gets a white flash. */
(function(){
  try{
    var saved = localStorage.getItem('ms.theme');
    var h = new Date().getHours();
    var theme = (saved === 'light' || saved === 'dark') ? saved : (h >= 7 && h < 19 ? 'light' : 'dark');
    document.documentElement.dataset.theme = theme;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', theme === 'dark' ? '#000000' : '#ffffff');
  }catch(e){ document.documentElement.dataset.theme = 'light'; }
})();
</script>
</head>
<body>

<div class="progress" aria-hidden="true"><i id="progressBar"></i></div>

<!-- ======================== NAV ======================== -->
<header class="nav" id="nav">
  <div class="nav__in">

    <div class="nav__left">
      <div class="seg" role="group" aria-label="Language">
        <span class="seg__pill" aria-hidden="true"></span>
        <button data-setlang="en">EN</button>
        <button data-setlang="ar">ع</button>
        <button data-setlang="tr">TR</button>
      </div>

      <button class="langbtn" id="langbtn" aria-label="Language"><span>EN</span></button>

      <button class="iconbtn" id="themebtn" aria-label="Theme">
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.2 12H2M22 12h-2.2M5.6 5.6 7.2 7.2M16.8 16.8l1.6 1.6M18.4 5.6 16.8 7.2M7.2 16.8l-1.6 1.6"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/></svg>
      </button>
    </div>

    <nav class="nav__links">
      <a href="#work" data-i18n="nav.work"></a>
      <a href="#system" data-i18n="nav.system"></a>
      <a href="#stack" data-i18n="nav.stack"></a>
      <a href="#path" data-i18n="nav.path"></a>
      <a href="#contact" data-i18n="nav.contact"></a>
    </nav>

    <a class="mark" href="#top" aria-label="Mohammed Saleh">
      <span class="mark__g">MS</span>
      <span class="mark__n">Mohammed&nbsp;Saleh</span>
    </a>

    <button class="burger" id="burger" aria-label="Menu"><i></i><i></i></button>

  </div>
</header>

<div class="menu" id="menu">
  <button class="menu__close" id="menuClose" aria-label="Close">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>

  <nav class="menu__links">
    <a href="#work" data-i18n="nav.work"></a>
    <a href="#system" data-i18n="nav.system"></a>
    <a href="#stack" data-i18n="nav.stack"></a>
    <a href="#path" data-i18n="nav.path"></a>
    <a href="#contact" data-i18n="nav.contact"></a>
  </nav>

  <div class="menu__langs" role="group" aria-label="Language">
    <button data-setlang="en">English</button>
    <button data-setlang="ar">العربية</button>
    <button data-setlang="tr">Türkçe</button>
  </div>
</div>

<main id="top">

<!-- ======================== HERO ======================== -->
<section class="hero">
  <canvas class="field" id="field" aria-hidden="true"></canvas>

  <div class="wrap hero__in">
    <div class="hero__meta">
      <span class="pulse mono"><i></i><span data-i18n="hero.avail"></span></span>
      <span class="mono" data-i18n="hero.role"></span>
      <span class="dot" aria-hidden="true"></span>
      <span class="mono" data-i18n="hero.loc"></span>
    </div>

    <h1 class="hero__title">
      <span class="hl" data-split data-i18n="hero.l1"></span>
      <span class="hl" data-split data-i18n="hero.l2"></span>
      <span class="hl" data-split data-i18n="hero.l3"></span>
    </h1>

    <p class="lede hero__sub" data-i18n="hero.sub"></p>

    <div class="hero__cta">
      <a class="btn btn--solid" href="#work">
        <span data-i18n="nav.work"></span>
        <svg viewBox="0 0 24 24"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
      </a>
      <a class="btn btn--ghost" href="#contact" data-i18n="nav.contact"></a>
    </div>
  </div>

  <div class="hero__foot">
    <span class="mono" data-i18n="hero.scroll"></span>
    <span class="hero__rail"><i></i></span>
  </div>
</section>

<!-- ======================= METRICS ====================== -->
<section class="metrics" id="metrics" aria-label="Key figures"></section>

<!-- ======================== SYSTEM ====================== -->
<section class="system" id="system" aria-label="How the systems work">
  <div class="system__stage">

    <div class="system__head">
      <span class="kicker mono"><b data-i18n="sys.k"></b></span>
      <h2 class="display" data-i18n="sys.h"></h2>
    </div>

    <svg class="loop" id="loop" viewBox="-160 -160 320 320" aria-hidden="true">
      <circle cx="0" cy="0" r="120"/>
      <path class="loop__arc" id="loopArc" d=""/>
      <g id="loopNodes"></g>
    </svg>

    <div class="stages" id="stages"></div>

    <div class="system__hud">
      <span class="mono" id="sysCount">01 / 04</span>
      <span class="system__rail" id="sysRail"><i></i></span>
      <span class="mono" data-i18n="sys.k"></span>
    </div>

  </div>
</section>

<!-- ========================= WORK ======================= -->
<section class="sec" id="work">
  <div class="wrap">
    <div class="head">
      <span class="kicker mono"><b data-i18n="work.k"></b></span>
      <h2 class="display reveal-lines" data-i18n="work.h"></h2>
      <p class="lede reveal" data-i18n="work.sub"></p>
    </div>

    <div class="filters" id="filters">
      <span class="filters__pill" aria-hidden="true"></span>
    </div>

    <div class="grid" id="workGrid"></div>
  </div>
</section>

<!-- ======================== STACK ======================= -->
<section class="sec" id="stack">
  <div class="wrap">
    <div class="head">
      <span class="kicker mono"><b data-i18n="stack.k"></b></span>
      <h2 class="display reveal-lines" data-i18n="stack.h"></h2>
    </div>
    <div class="stackgrid" id="stackGrid"></div>
  </div>
</section>

<!-- ========================= PATH ======================= -->
<section class="sec path" id="path">
  <div class="wrap">
    <div class="head">
      <span class="kicker mono"><b data-i18n="exp.k"></b></span>
      <h2 class="display reveal-lines" data-i18n="exp.h"></h2>
    </div>
    <div id="pathList"></div>
  </div>
</section>

<!-- ======================= PROFILE ====================== -->
<section class="sec">
  <div class="wrap profile">
    <div class="reveal">
      <span class="kicker mono"><b data-i18n="edu.k"></b></span>
      <div class="edu">
        <b data-i18n="edu.d"></b>
        <span data-i18n="edu.o"></span>
        <span class="mono" data-i18n="edu.g"></span>
      </div>
    </div>

    <div class="reveal">
      <span class="kicker mono"><b data-i18n="lang.k"></b></span>
      <div id="langList"></div>
    </div>
  </div>
</section>

<!-- ======================= CONTACT ====================== -->
<section class="sec contact" id="contact">
  <div class="wrap">
    <div class="head head--mid">
      <span class="kicker mono"><b data-i18n="c.k"></b></span>
      <h2 class="display reveal-lines" data-i18n="c.h"></h2>
      <p class="lede reveal" data-i18n="c.sub"></p>
    </div>
    <div class="cards" id="contactCards"></div>
  </div>
</section>

<footer class="wrap foot">
  <span class="mono">© <b id="yr"></b> Mohammed Saleh</span>
  <span class="mono" data-i18n="foot.r"></span>
  <span class="foot__s" id="social"></span>
</footer>

</main>

<!-- ===================== ASSISTANT ===================== -->
<button class="ai__launcher" id="aiLauncher" aria-expanded="false" aria-controls="aiPanel">
  <span class="ai__orb" aria-hidden="true"><i></i><i></i><i></i></span>
  <span class="ai__label" data-i18n="ai.open"></span>
</button>

<section class="ai" id="aiPanel" aria-label="AI assistant">
  <header class="ai__head">
    <div class="ai__id">
      <span class="ai__orb ai__orb--sm" aria-hidden="true"><i></i><i></i><i></i></span>
      <div>
        <b data-i18n="ai.title"></b>
        <span class="ai__status mono" id="aiStatus" data-state="idle"><i></i><span></span></span>
      </div>
    </div>
    <button class="ai__x" id="aiClose" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>

  <div class="ai__log" id="aiLog"></div>

  <form class="ai__form" id="aiForm">
    <textarea id="aiInput" rows="1" data-i18n-ph="ai.ph" autocomplete="off"></textarea>
    <button class="ai__send" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
    </button>
  </form>

  <p class="ai__foot mono" data-i18n="ai.foot"></p>
</section>

<div class="toast" id="toast" role="status"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
