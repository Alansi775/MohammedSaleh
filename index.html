<script>
/* Inline and blocking on purpose: the theme has to be on <html> before
   the first paint, or a night visitor gets a white flash. */
(function(){
  try{
    var saved = localStorage.getItem('ms.theme');
    var h = new Date().getHours();
    var theme = (saved === 'light' || saved === 'dark') ? saved : (h >= 7 && h < 19 ? 'light' : 'dark');
    document.documentElement.dataset.theme = theme;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', theme === 'dark' ? '#000000' : '#ffffff');
  }catch(e){ document.documentElement.dataset.theme = 'light'; }
})();
</script>
